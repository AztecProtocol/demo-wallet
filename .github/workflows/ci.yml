name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Skip stale runs when a PR gets pushed rapidly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  build:
    name: Build Artifacts
    needs: lint
    uses: ./.github/workflows/build-artifacts.yml
    with:
      release-mode: false
      retention-days: 7

  # Sentinel job. `deploy-web.yml` on `pull_request_target` waits for this
  # single stable check name before deploying a preview — avoids coupling
  # the deploy workflow to every individual CI job name (including the
  # dynamically-named matrix jobs from build-artifacts).
  ci-complete:
    name: CI Complete
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI jobs passed."
