name: Deploy Web Wallet

on:
  workflow_call:
    inputs:
      production:
        description: "Deploy to production (true) or preview (false)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref to check out"
        required: false
        type: string
        default: ""
      pr-number:
        description: "PR number to comment on (omit to skip comment)"
        required: false
        type: number
        default: 0
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: ${{ inputs.production && 'Deploy (production)' || 'Deploy (preview)' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: ./web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build and deploy
        id: deploy
        working-directory: ./web
        run: |
          if [ "${{ inputs.production }}" == "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: ${{ inputs.pr-number != 0 }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ inputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Web wallet deployed!\n\n**Preview URL:** ${{ steps.deploy.outputs.url }}'
            })
